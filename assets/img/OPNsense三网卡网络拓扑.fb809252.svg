<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">OPNsense 三网卡区域隔离网络拓扑</text>

  <!-- ============ WAN 区域 ============ -->
  <rect x="15" y="70" width="220" height="420" rx="10" fill="#fdecea" stroke="#e53935" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="125" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">WAN · 不可信区</text>
  <text x="125" y="112" text-anchor="middle" font-size="12" fill="#e57373">桥接模式 · 直连手机热点</text>

  <rect x="45" y="150" width="160" height="90" rx="8" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
  <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">手机热点</text>
  <text x="125" y="198" text-anchor="middle" font-size="12" fill="#607d8b">Hotspot / Bridged</text>
  <text x="125" y="220" text-anchor="middle" font-size="12" fill="#c62828">热点分配 192.168.x.x (DHCP)</text>

  <text x="378" y="196" text-anchor="end" font-size="12" fill="#1565c0">em0</text>
  <path d="M205,195 H385" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="183" text-anchor="middle" font-size="12" fill="#455a64">WAN 桥接</text>

  <!-- ============ OPNsense 虚拟机 ============ -->
  <rect x="385" y="115" width="210" height="170" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="490" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">OPNsense 虚拟机</text>
  <text x="490" y="158" text-anchor="middle" font-size="12" fill="#1565c0">FreeBSD · CE 26.7</text>
  <text x="398" y="186" font-size="12" fill="#37474f">em0 · WAN · 桥接 (DHCP)</text>
  <text x="398" y="214" font-size="12" fill="#37474f">em1 · LAN · vmnet3 · 192.168.200.254</text>
  <text x="398" y="242" font-size="12" fill="#37474f">em2 · DMZ · vmnet2 · 10.0.10.254</text>
  <text x="490" y="268" text-anchor="middle" font-size="11" fill="#0d47a1">Web 管理: https://192.168.200.254</text>

  <!-- ============ LAN 区域 ============ -->
  <rect x="735" y="70" width="220" height="420" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="845" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">LAN · 可信内网</text>
  <text x="845" y="112" text-anchor="middle" font-size="12" fill="#43a047">vmnet3 · 仅主机 · 管理入口</text>

  <rect x="755" y="160" width="180" height="90" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="845" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">宿主 管理机</text>
  <text x="845" y="210" text-anchor="middle" font-size="12" fill="#607d8b">192.168.200.1</text>
  <text x="845" y="232" text-anchor="middle" font-size="12" fill="#1b5e20">VMware 自动分配</text>

  <rect x="755" y="320" width="180" height="80" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="845" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">LAN 客户端</text>
  <text x="845" y="370" text-anchor="middle" font-size="12" fill="#607d8b">192.168.200.x (OPNsense DHCP)</text>

  <text x="602" y="214" font-size="12" fill="#1565c0">em1</text>
  <path d="M595,214 H755" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="204" text-anchor="middle" font-size="12" fill="#455a64">192.168.200.0/24</text>
  <path d="M660,214 V330 H755" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ DMZ 区域 ============ -->
  <rect x="250" y="320" width="460" height="290" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="480" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">DMZ · 半可信对外服务区</text>
  <text x="480" y="362" text-anchor="middle" font-size="12" fill="#fb8c00">vmnet2 · 仅主机 · 对外 Web 服务</text>

  <rect x="285" y="400" width="190" height="100" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
  <text x="380" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Windows VM</text>
  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#607d8b">10.0.10.60 · 网关 10.0.10.254</text>
  <text x="380" y="472" text-anchor="middle" font-size="11" fill="#e65100">出网验证：ping 1.1.1.1</text>

  <rect x="505" y="400" width="170" height="100" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
  <text x="590" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">DMZ 测试机</text>
  <text x="590" y="452" text-anchor="middle" font-size="12" fill="#607d8b">10.0.10.50 · 网关 10.0.10.254</text>
  <text x="590" y="472" text-anchor="middle" font-size="11" fill="#e65100">隔离验证：ping LAN 不通</text>

  <text x="490" y="300" text-anchor="middle" font-size="12" fill="#1565c0">em2</text>
  <path d="M455,285 V345 H380 V400" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M525,285 V345 H590 V400" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="334" text-anchor="middle" font-size="12" fill="#455a64">10.0.10.0/24 (em2)</text>

  <text x="480" y="590" text-anchor="middle" font-size="12" fill="#e65100">区域规则：DMZ → LAN 拒绝（block 在上，allow 在下）</text>

  <!-- ============ 规则面板 ============ -->
  <rect x="15" y="505" width="225" height="125" rx="8" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="127" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">区域间默认规则</text>
  <text x="30" y="556" font-size="13" fill="#1b5e20">LAN → any　　✓ 放行</text>
  <text x="30" y="578" font-size="13" fill="#1b5e20">DMZ → WAN　✓ 放行</text>
  <text x="30" y="600" font-size="13" fill="#c62828">DMZ → LAN　✗ 拒绝</text>
  <text x="30" y="622" font-size="13" fill="#c62828">WAN → 内网　✗ 拒绝入站</text>

  <!-- ============ 图例 ============ -->
  <rect x="735" y="505" width="220" height="90" rx="8" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="845" y="528" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">图例</text>
  <line x1="750" y1="552" x2="788" y2="552" stroke="#455a64" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="796" y="556" font-size="12" fill="#37474f">区域边界</text>
  <line x1="750" y1="578" x2="788" y2="578" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="796" y="582" font-size="12" fill="#37474f">物理链路 / 网关</text>
</svg>
