name: 更新 Star 仓库列表

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动更新一次
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 获取全部 Star 仓库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # 使用仓库所有者的公开 Star 列表，无需额外配置 PAT
          gh api --paginate "/users/${OWNER}/starred?per_page=100" \
            --jq '.[] | [.full_name, (.language // "其他"), .stargazers_count] | @tsv' \
            > "$RUNNER_TEMP/starred.tsv"

      - name: 生成 Markdown 页面
        run: node scripts/generate-stars.mjs "$RUNNER_TEMP/starred.tsv" src/stars.md

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stars.md
          if git diff --cached --quiet; then
            echo "Star 列表无变化，无需提交"
          else
            git commit -m "chore: 更新 Star 仓库列表"
            git push
          fi
